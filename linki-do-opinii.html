<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bezpośrednie linki do opinii o produktach</title>
  <style>
    :root { color-scheme: dark; --bg:#0d0d0f; --card:#18181b; --line:#303036; --text:#f5f5f5; --muted:#b8b8c0; --yellow:#ffd000; --pink:#ed1160; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 Arial,sans-serif; }
    main { width:min(1100px,calc(100% - 28px)); margin:36px auto; }
    h1 { margin:0 0 8px; font-size:clamp(25px,4vw,42px); }
    .lead { color:var(--muted); margin:0 0 26px; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
    button { border:1px solid var(--line); border-radius:10px; background:#202024; color:#fff; padding:11px 15px; font-weight:700; cursor:pointer; }
    button:hover { border-color:var(--yellow); color:var(--yellow); }
    ol { margin:0; padding:0; list-style:none; display:grid; gap:10px; counter-reset:item; }
    li { counter-increment:item; display:grid; grid-template-columns:minmax(220px,32%) 22px minmax(0,1fr); align-items:center; gap:8px; padding:13px 15px; border:1px solid var(--line); border-radius:12px; background:var(--card); }
    li::before { content:counter(item) "."; color:#777; position:absolute; transform:translateX(-38px); }
    .open { color:var(--yellow); font-weight:800; text-decoration:none; }
    .open:hover { text-decoration:underline; }
    .dash { text-align:center; color:#777; }
    .copy { min-width:0; border:0; padding:0; background:transparent; color:var(--muted); font:inherit; text-align:left; overflow-wrap:anywhere; cursor:pointer; }
    .copy:hover { color:#fff; text-decoration:underline; }
    .copy::after { content:"  ⧉"; color:var(--pink); font-weight:900; }
    #toast { position:fixed; left:50%; bottom:24px; translate:-50% 20px; opacity:0; pointer-events:none; background:#202024; border:1px solid var(--pink); box-shadow:0 0 18px #ed116066; border-radius:12px; padding:12px 18px; font-weight:800; transition:.2s ease; }
    #toast.show { opacity:1; translate:-50% 0; }
    @media (max-width:700px) {
      main { margin:22px auto; }
      li { grid-template-columns:1fr; gap:5px; }
      li::before { display:none; }
      .dash { display:none; }
      .copy { font-size:13px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Linki do wystawiania opinii</h1>
    <p class="lead">Kliknij żółtą nazwę, aby otworzyć formularz z wybranym produktem. Kliknij pełny adres po myślniku, aby skopiować go do schowka.</p>
    <div class="actions"><button id="copyAll">⧉ KOPIUJ WSZYSTKIE LINKI</button></div>
    <ol id="links"></ol>
  </main>
  <div id="toast" role="status" aria-live="polite">Link skopiowany</div>
  <script>
    const base = 'https://wujekszpon.github.io/opinie-o-produktach/';
    const productsUrl = 'https://raw.githubusercontent.com/WujekSzpon/opinie-o-produktach/main/produkty-opinie.json';
    const fallbackProducts = [
      'Gitarowy GPS E Book',
      'Gitarowy GPS Aplikacja',
      'Najlepsze Polskie Riffy',
      'Gitarowe Ćwiczenia',
      'Teoria Muzyki',
      'Bicia Akordowe',
      'Schematy skal na gryfie',
      'Schematy tonacji na gryfie',
      'Interwały na gryfie „w pigułce”',
      '20 Zagrywek Blues-Moll',
      'Świąteczne Opracowania',
      'Gitarowy Mentoring',
      'Lekcje Online',
      'Transkrypcja Utworu',
      'Oryginalne Aranżacje',
      'Najlepsze Polskie Solówki',
      'Opracowania Fingerstyle',
      'Linia Melodyczna',
      'Mistrz Jednej Struny'
    ];

    const list = document.querySelector('#links');
    const toast = document.querySelector('#toast');
    let products = [];
    let toastTimer;

    function productSlug(value) {
      return String(value || '')
        .toLocaleLowerCase('pl-PL')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/ł/g, 'l')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    function urlFor(name) { return base + '?produkt=' + productSlug(name); }

    async function copyText(text, message='Link skopiowany') {
      try { await navigator.clipboard.writeText(text); }
      catch (_) {
        const area = document.createElement('textarea');
        area.value = text;
        document.body.append(area);
        area.select();
        document.execCommand('copy');
        area.remove();
      }
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function renderProducts(items) {
      products = [...new Set(items.map(item => String(item).trim()).filter(Boolean))];
      list.replaceChildren();

      products.forEach(name => {
        const url = urlFor(name);
        const li = document.createElement('li');
        const open = document.createElement('a');
        const dash = document.createElement('span');
        const copy = document.createElement('button');

        open.className = 'open';
        open.href = url;
        open.target = '_blank';
        open.rel = 'noopener';
        open.textContent = name;

        dash.className = 'dash';
        dash.textContent = '—';

        copy.className = 'copy';
        copy.type = 'button';
        copy.title = 'Kliknij, aby skopiować';
        copy.textContent = url;
        copy.addEventListener('click', () => copyText(url));

        li.append(open, dash, copy);
        list.append(li);
      });
    }

    async function loadProducts() {
      renderProducts(fallbackProducts);
      try {
        const response = await fetch(`${productsUrl}?v=${Date.now()}`, {cache:'no-store'});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const items = Array.isArray(data) ? data : data.products;
        if (!Array.isArray(items)) throw new Error('Nieprawidłowy format listy produktów');
        renderProducts(items);
      } catch (error) {
        console.warn('Nie udało się pobrać listy produktów z GitHuba. Używam listy zapasowej.', error);
      }
    }

    document.querySelector('#copyAll').addEventListener('click', () => {
      copyText(products.map(name => `${name} - ${urlFor(name)}`).join('\n'), 'Skopiowano wszystkie linki');
    });

    loadProducts();
  </script>
</body>
</html>
